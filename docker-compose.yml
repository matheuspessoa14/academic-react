
services:
  postgres:
    image: postgres:17
    container_name: devflix-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: devflix
      POSTGRES_PASSWORD: devflix123
      POSTGRES_DB: devflix_db

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U devflix -d devflix_db
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
